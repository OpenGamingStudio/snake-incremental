<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake Incremental</title>
<meta name="description" content="Snake Incremental, un jeu web open source d'OpenGamingStudio : mange des pommes, améliore ton serpent, prestige.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#2E9E4A">
<meta name="referrer" content="no-referrer">
<link rel="preload" href="fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="mx-auto max-w-[960px] px-4 pt-3 pb-1.5">
  <div class="flex items-center gap-3"><h1 class="casual m-0 text-[clamp(1.5rem,6vw,2.25rem)] leading-tight text-encre"><span class="logo">Snake</span> Incremental</h1>
    <button id="mute" class="btn ml-auto min-h-11 min-w-11 px-4 text-base" aria-label="Son" aria-pressed="false">Son</button></div>
  <div class="mt-3 flex flex-wrap items-end gap-x-5 gap-y-2"><span class="flex items-baseline gap-2"><b id="coins" class="casual text-compteur leading-none tabular-nums text-encre">0</b><small class="casual text-taux text-foret">pièces</small></span><span id="combo" class="casual text-palier leading-none" aria-live="polite"></span></div>
  <div id="info" class="mono mt-2 text-taux text-mine"></div>
</header>
<main class="mx-auto flex max-w-[960px] flex-wrap justify-center gap-6 px-4 pt-2.5 pb-8">
  <section class="w-[min(480px,100%)]">
    <canvas id="board" class="block aspect-square w-full touch-none rounded-plateau border-3 border-encre bg-quadrille shadow-dure" width="480" height="480" aria-label="Plateau de jeu"></canvas>
    <div class="mt-4 hidden grid-cols-3 gap-2.5 pointer-coarse:grid [@media(any-pointer:coarse)]:grid" aria-label="Contrôles">
      <button data-dir="up" class="btn pad col-start-2 flex min-h-14 justify-center p-3" aria-label="Haut"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 15l7-7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg></button>
      <button data-dir="left" class="btn pad col-start-1 row-start-2 flex min-h-14 justify-center p-3" aria-label="Gauche"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg></button>
      <button data-dir="down" class="btn pad col-start-2 row-start-2 flex min-h-14 justify-center p-3" aria-label="Bas"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg></button>
      <button data-dir="right" class="btn pad col-start-3 row-start-2 flex min-h-14 justify-center p-3" aria-label="Droite"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg></button>
    </div>
  </section>
  <section class="w-full max-w-105 min-w-0 md:flex-[1_1_320px]">
    <h2 class="casual mt-2 mb-3 inline-block -rotate-2 text-palier leading-none text-encre">Registre</h2>
    <div id="shop" class="registre"></div>
    <button id="prestige" class="btn prestige mt-4 min-h-12 w-full p-3 text-ligne"></button>
    <h2 class="casual mt-8 mb-2 text-[1.5rem] text-encre">Succès</h2>
    <ul id="achievements" class="m-0 list-none p-0 text-[.9rem]"></ul>
    <p class="mt-6 flex flex-wrap items-center gap-x-4 gap-y-2 text-note text-mine"><button id="reset" class="btn min-h-11 px-3 text-note">Réinitialiser</button>
      <a class="inline-flex min-h-11 items-center font-semibold text-foret underline decoration-2" rel="noopener noreferrer" href="https://github.com/OpenGamingStudio/snake-incremental">Code (MIT)</a>
      <a class="inline-flex min-h-11 items-center font-semibold text-foret underline decoration-2" rel="noopener noreferrer" href="https://opengamingstudio.com">OpenGamingStudio</a></p>
  </section>
</main>
<div id="toasts" class="pointer-events-none fixed top-2.5 left-1/2 z-10 flex w-max max-w-[calc(100vw-1rem)] -translate-x-1/2 flex-col items-center gap-2"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
