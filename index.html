<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Snake Incremental</title>
<meta name="description" content="Snake Incremental, un jeu web open source d'OpenGamingStudio : mange des pommes, améliore ton serpent, prestige.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🐍 Snake Incremental</h1>
  <div class="bar"><span class="coins">🪙 <b id="coins">0</b></span><span id="combo" class="combo"></span>
    <button id="mute" aria-label="Son">🔊</button></div>
  <div id="info" class="info"></div>
</header>
<main>
  <section class="play">
    <canvas id="board" width="480" height="480" aria-label="Plateau de jeu"></canvas>
    <div class="pad" aria-label="Contrôles">
      <button data-dir="up" aria-label="Haut">▲</button>
      <button data-dir="left" aria-label="Gauche">◀</button>
      <button data-dir="down" aria-label="Bas">▼</button>
      <button data-dir="right" aria-label="Droite">▶</button>
    </div>
  </section>
  <section class="side">
    <h2>Améliorations</h2>
    <div id="shop"></div>
    <button id="prestige" class="prestige"></button>
    <h2>Succès</h2>
    <ul id="achievements"></ul>
    <p class="foot"><button id="reset">Réinitialiser</button>
      · <a href="https://github.com/OpenGamingStudio/snake-incremental">Code (MIT)</a>
      · <a href="https://opengamingstudio.com">OpenGamingStudio</a></p>
  </section>
</main>
<div id="toasts"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
