# Site statique Snake Incremental : en-têtes de sécurité HTTP.
# Copié dans /etc/nginx/conf.d/default.conf par le Dockerfile.
# Attention : un add_header dans un bloc location annule ceux du server ;
# ne pas en ajouter sans répéter toute la liste.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # CSP identique à la <meta> de index.html, plus les directives réservées aux en-têtes.
    # Tailwind est compilé dans style.css (pas de style inline) : style-src 'self' suffit.
    # Le canvas n'exige rien de plus ; les polices sont locales.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # nginx 1.27 ne connaît pas l'extension .webmanifest (pas d'add_header ici : ceux du server restent).
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # Interdit les fichiers cachés (.git, .env…), sauf /.well-known.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
}
